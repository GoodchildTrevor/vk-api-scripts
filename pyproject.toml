[project]
name = "vk-api-scripts"
version = "1.0.0"
description = "FastAPI REST wrapper and MCP server for VK API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.7.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
legacy = [
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
